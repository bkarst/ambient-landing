<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ambiently</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--accent); }
  .deep { fill: var(--ink); }
  .steel { fill: var(--ink-muted); }
  .relief { fill: var(--surface-hover); }
  .blk { rx: var(--radius-lg); }
  .cut { fill: var(--surface); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: 0.95; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 176x256 bled off the top (Ambient Yellow, the one hue, largest) · ink 128x160 (white on navy, Deep Navy on white: the identity's other pole) · ink-muted 96x96 (Steel Gray) · surface-hover 160x80 bleeding off the right edge (relief) - about 40% of 960x288
  arrangement one tall yellow slab with satellites, bottoms on one line space-12 above the edge, space-4 gutters, nothing left of x=480
  pattern     the halftone, from the mark itself and "data as points of light": a 5x8 dot grid at a space-8 pitch cut from the slab in the ground colour, radii stepping space-2 > radius-sm > space-1 > 2px away from the slab's centre - 40 units
  scales      sides in space-4 multiples; gutters space-4; pitch space-8; corners radius-lg on every block; dot radii space-2, radius-sm, space-1
-->
<rect class="brand blk" x="16" y="-16" width="176" height="256" rx="16"/>
<rect class="deep blk" x="208" y="80" width="128" height="160" rx="16"/>
