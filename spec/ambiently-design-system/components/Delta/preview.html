<!-- @dsCard group="Status" height=64 subtitle="A signed change with its arrow; colour follows direction × whether up is good" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Delta — preview</title>
<style>.wrap { padding: 20px 24px; gap: 28px; }</style>
</head>
<body class="amb-page">
<div id="root"></div>
<script>
  var A = window.Ambiently, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap amb-row' },
    h(A.Delta, { value: 12, period: 'vs last week' }),
    h(A.Delta, { value: -4.6, period: 'vs last week' }),
    h(A.Delta, { value: 12, upIsGood: false, period: 'spend' }),
    h(A.Delta, { value: -8, upIsGood: false, period: 'spend' }),
    h(A.Delta, { value: 0 }),
    h(A.Delta, { value: 1284, suffix: '', format: function (v) { return A.format.compact(v, '$'); }, upIsGood: false })
  ));
</script>
</body>
</html>
