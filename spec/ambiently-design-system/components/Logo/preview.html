<!-- @dsCard group="Brand" height=240 subtitle="Mark, wordmark, lockup and app icon" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo — preview</title>
<style>
  .wrap { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; padding: 24px; align-items: start; }
  .cell { display: flex; flex-direction: column; gap: 14px; }
  .cap { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
  .ground { display: flex; align-items: center; justify-content: center; min-height: 120px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface-raised); }
  .ground.is-light { background: #ffffff; color: #0b1b3d; border-color: #0b1b3d14; }
  .ground.is-light .amb-logo { color: #0b1b3d; }
  .amb-logo-tag { white-space: nowrap; }
</style>
</head>
<body class="amb-page">
<div id="root"></div>
<script>
  var A = window.Ambiently, h = React.createElement;
  function cell(cap, child, light) {
    return h('div', { className: 'cell' }, h('span', { className: 'cap' }, cap), h('div', { className: 'ground' + (light ? ' is-light' : '') }, child));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap' },
    cell('Mark', h(A.Logo, { variant: 'mark', size: 96 })),
    cell('Wordmark', h(A.Logo, { variant: 'wordmark', size: 34, tagline: true })),
    cell('Lockup', h(A.Logo, { variant: 'lockup', size: 26, tagline: true })),
    cell('App icon · on white', h('div', { className: 'amb-row', style: { gap: 14, flexWrap: 'nowrap' } }, h(A.Logo, { variant: 'app-icon', size: 64 }), h(A.Logo, { variant: 'lockup', size: 18 })), true)
  ));
</script>
</body>
</html>
