<!-- @dsCard group="Actions" height=80 subtitle="Round, labelled for assistive tech, three sizes" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>.wrap { padding: 20px 24px; }</style>
</head>
<body class="amb-page">
<div id="root"></div>
<script>
  var A = window.Ambiently, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'wrap amb-row' },
    h(A.IconButton, { icon: 'play', label: 'Play' }),
    h(A.IconButton, { icon: 'search', label: 'Search' }),
    h(A.IconButton, { icon: 'download', label: 'Download', variant: 'primary' }),
    h(A.IconButton, { icon: 'more', label: 'More', variant: 'ghost' }),
    h(A.IconButton, { icon: 'close', label: 'Close', size: 'sm' }),
    h(A.IconButton, { icon: 'plus', label: 'Add', size: 'lg', variant: 'primary' }),
    h(A.IconButton, { icon: 'filter', label: 'Filter', disabled: true })
  ));
</script>
</body>
</html>
